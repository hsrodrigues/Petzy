<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petzy · Painel SaaS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-dark navbar-dark px-4 py-3">
  <span class="navbar-brand d-flex align-items-center gap-2 fw-bold"><span class="brand-logo">🐾</span> Petzy <span class="badge bg-primary ms-1">SaaS Admin</span></span>
  <div class="d-flex gap-2"><a href="app.html" class="btn btn-sm btn-outline-light">Ir para o app</a><button class="btn btn-sm btn-light" id="sair">Sair</button></div>
</nav>

<main class="container-fluid p-4" id="main"><div class="loading"><div class="spinner-border"></div></div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { auth, db, onAuthStateChanged, signOut, collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, chamarFuncao } from './js/firebase.js';
  import { PLANOS, carregarPlanos } from './js/store.js';
  import { $, esc, money, fmtDate, badge, kpi, toast, formModal, modal, confirmar, norm, toISODate } from './js/ui.js';
  import { renderPix, txid, linkPagamento, copiar } from './js/pix.js';

  const DIA = 86400000;
  let clinicas = [], solicitacoes = [], cfg = {};

  $('#sair').onclick = async () => { await signOut(auth); location.replace('admin-login.html'); };

  onAuthStateChanged(auth, async (user) => {
    if (!user) return location.replace('admin-login.html');
    const sa = await getDoc(doc(db, 'superadmins', user.uid)).catch(() => null);
    if (!sa?.exists()) {
      $('#main').innerHTML = `<div class="empty-state"><i class="bi bi-shield-lock"></i><h5>Acesso restrito</h5>
        <p>Esta área é exclusiva do dono do Petzy.<br>Para liberar, crie no Firestore o documento <code>superadmins/${user.uid}</code>.</p>
        <a href="app.html" class="btn btn-primary">Voltar ao app</a></div>`;
      return;
    }
    await carregarPlanos();
    await carregar();
  });

  const situacao = (c) => {
    if (c.status === 'bloqueado') return ['Bloqueada', 'danger'];
    if (c.status === 'cancelado') return ['Cancelada', 'secondary'];
    if ((c.validoAteMs || 0) < Date.now()) return ['Vencida', 'danger'];
    if (c.status === 'trial') return ['Teste', 'info'];
    if (c.validoAteMs - Date.now() < 5 * DIA) return ['Vence logo', 'warning'];
    return ['Ativa', 'success'];
  };

  async function carregar() {
    const [cs, ss, cf] = await Promise.all([getDocs(collection(db, 'clinicas')), getDocs(collection(db, 'solicitacoes')), getDoc(doc(db, 'sistema', 'config'))]);
    clinicas = cs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
    solicitacoes = ss.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => s.status === 'pendente');
    cfg = cf.exists() ? cf.data() : {};
    desenhar();
  }

  function desenhar() {
    const ativas = clinicas.filter(c => c.status === 'ativo' && c.validoAteMs > Date.now());
    const mrr = ativas.reduce((s, c) => s + (c.valorMensal || PLANOS[c.plano]?.preco || 0), 0);
    $('#main').innerHTML = `
      <div class="page-header"><div><h1>Painel do SaaS</h1><p>Clínicas, licenças e cobranças</p></div>
        <div class="d-flex gap-2"><button class="btn btn-light border" id="btnPlanos"><i class="bi bi-tags me-1"></i>Planos e preços</button>
        <button class="btn btn-light border" id="btnCfg"><i class="bi bi-gear me-1"></i>Formas de pagamento</button>
        <button class="btn btn-light border" id="btnFiscal"><i class="bi bi-receipt-cutoff me-1"></i>Integração fiscal</button>
        <button class="btn btn-light border" id="btnLegal"><i class="bi bi-file-earmark-text me-1"></i>Dados legais</button>
        <button class="btn btn-light border" id="btnSuperadmins"><i class="bi bi-shield-lock me-1"></i>Administradores</button></div></div>
      <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">${kpi('building', 'Clínicas cadastradas', clinicas.length)}</div>
        <div class="col-6 col-xl-3">${kpi('check-circle', 'Assinantes ativos', ativas.length, 'success')}</div>
        <div class="col-6 col-xl-3">${kpi('hourglass', 'Em teste', clinicas.filter(c => c.status === 'trial' && c.validoAteMs > Date.now()).length, 'info')}</div>
        <div class="col-6 col-xl-3">${kpi('currency-dollar', 'Receita mensal (MRR)', money(mrr), 'warning')}</div>
      </div>
      ${solicitacoes.length ? `<div class="card mb-4 border-primary"><div class="card-header text-primary"><i class="bi bi-bell me-1"></i>Pagamentos a confirmar (${solicitacoes.length})</div>
        <div class="list-group list-group-flush">${solicitacoes.map(s => `<div class="list-group-item d-flex flex-wrap gap-2 align-items-center">
          <div class="flex-fill"><strong>${esc(s.clinicaNome)}</strong> pagou o plano <strong>${esc(PLANOS[s.plano]?.nome)}</strong> · ${s.meses || 1} mês(es) · ${money(s.valor)}
          <div class="fs-8 text-muted">${esc(s.solicitanteEmail)} · ${fmtDate(s.criadoEm?.slice(0, 10))}</div></div>
          <button class="btn btn-sm btn-outline-danger" data-rej="${s.id}">Recusar</button>
          <button class="btn btn-sm btn-success" data-apr="${s.id}"><i class="bi bi-check2 me-1"></i>Confirmar pagamento</button></div>`).join('')}</div></div>` : ''}
      <div class="card">
        <div class="card-header d-flex gap-2 align-items-center"><span>Clínicas</span><input class="form-control ms-auto" style="max-width:280px" id="busca" placeholder="Buscar clínica ou e-mail..."></div>
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Clínica</th><th>Plano</th><th>Situação</th><th>Válida até</th><th>Cadastro</th><th class="text-end">Ações</th></tr></thead><tbody id="tb"></tbody></table></div>
      </div>`;
    desenharTabela();
    $('#busca').oninput = desenharTabela;
    $('#btnCfg').onclick = configurar;
    $('#btnPlanos').onclick = configurarPlanos;
    $('#btnFiscal').onclick = configurarFiscal;
    $('#btnLegal').onclick = configurarLegal;
    $('#btnSuperadmins').onclick = gerenciarSuperadmins;
    $('#main').onclick = acoes;
  }

  // Token de produção da conta PlugNotas da plataforma: validado na TecnoSpeed e guardado no Secret Manager
  async function configurarFiscal() {
    const meta = (await getDoc(doc(db, 'admin', 'integracaoFiscal')).catch(() => null))?.data() || {};
    const quando = meta.tokenConfiguradoEm?.toDate?.().toLocaleString('pt-BR');
    formModal({
      title: 'Integração fiscal · TecnoSpeed', size: 'md', submit: 'Validar e salvar token',
      fields: [
        { type: 'custom', col: 'col-12', html: `<div class="alert alert-${quando ? 'success' : 'warning'} fs-7 mb-0">${quando
          ? `Token de produção configurado em <strong>${esc(quando)}</strong>.`
          : 'Nenhum token de produção configurado. As clínicas conseguem emitir apenas no <strong>modo teste</strong> (sem valor fiscal).'}</div>` },
        { name: 'token', label: 'Token de produção da conta PlugNotas', type: 'password', required: true, col: 'col-12', attrs: 'autocomplete="new-password" minlength="10"' },
        { type: 'custom', col: 'col-12', html: '<div class="text-muted fs-8"><i class="bi bi-shield-lock me-1"></i>O token é validado na TecnoSpeed e gravado no Secret Manager do Google Cloud. Ele não fica no navegador nem no banco de dados, e a troca vale para todas as clínicas em até 1 minuto.</div>' }
      ],
      onSubmit: async (d) => {
        try { await chamarFuncao('configurarTokenTecnoSpeed', { token: d.token }); }
        catch (e) { throw new Error(e.code === 'functions/internal' && e.message === 'internal' ? 'O serviço fiscal está indisponível no momento.' : e.message); }
        toast('Token da TecnoSpeed validado e salvo com segurança');
      }
    });
  }

  function configurarPlanos() {
    formModal({
      title: 'Planos e preços',
      values: { precoBasico: PLANOS.basico.preco, precoPro: PLANOS.pro.preco, precoPremium: PLANOS.premium.preco },
      fields: [
        { type: 'section', label: 'Os novos preços aparecem na página principal, na assinatura e nas novas cobranças.' },
        { name: 'precoBasico', label: 'Plano Básico (R$/mês)', type: 'money', required: true, col: 'col-md-4' },
        { name: 'precoPro', label: 'Plano Profissional (R$/mês)', type: 'money', required: true, col: 'col-md-4' },
        { name: 'precoPremium', label: 'Plano Premium (R$/mês)', type: 'money', required: true, col: 'col-md-4' }
      ],
      onSubmit: async (d) => {
        const valores = { basico: Number(d.precoBasico), pro: Number(d.precoPro), premium: Number(d.precoPremium) };
        if (Object.values(valores).some(v => !Number.isFinite(v) || v < 0)) throw new Error('Informe preços válidos para todos os planos.');
        await Promise.all(Object.entries(valores).map(([id, preco]) => setDoc(doc(db, 'planos', id), { preco, atualizadoEm: new Date().toISOString() }, { merge: true })));
        Object.entries(valores).forEach(([id, preco]) => { PLANOS[id].preco = preco; });
        toast('Preços dos planos atualizados');
        await carregar();
      }
    });
  }

  function desenharTabela() {
    const q = norm($('#busca')?.value);
    $('#tb').innerHTML = clinicas.filter(c => !q || norm(c.nome + c.email).includes(q)).map(c => { const [s, cor] = situacao(c); return `<tr>
      <td><div class="fw-semibold">${esc(c.nome)}</div><div class="fs-8 text-muted">${esc(c.email || '')} · ${esc(c.telefone || '')}</div>${c.redeId ? `<span class="badge badge-soft-info mt-1"><i class="bi bi-diagram-3 me-1"></i>Rede: ${esc(c.redeId)}</span>` : ''}</td>
      <td>${esc(PLANOS[c.plano]?.nome || c.plano)}</td><td>${badge(s, cor)}</td>
      <td class="fs-7">${c.validoAteMs ? new Date(c.validoAteMs).toLocaleDateString('pt-BR') : '—'}</td>
      <td class="fs-7">${fmtDate(c.criadoEm?.slice(0, 10))}</td>
      <td class="text-end text-nowrap">
        ${c.telefone ? `<a class="btn btn-icon btn-light" target="_blank" href="https://wa.me/55${c.telefone.replace(/\D/g, '')}"><i class="bi bi-whatsapp text-success"></i></a>` : ''}
        <button class="btn btn-sm btn-primary" data-cob="${c.id}"><i class="bi bi-qr-code me-1"></i>Cobrar</button>
        <button class="btn btn-sm btn-success" data-pag="${c.id}">Registrar pagamento</button>
        <button class="btn btn-sm btn-light border" data-trial="${c.id}" title="Estender teste">+7 dias</button>
        <button class="btn btn-sm btn-light border" data-rede="${c.id}" title="Agrupar em rede"><i class="bi bi-diagram-3"></i></button>
        <button class="btn btn-sm ${c.status === 'bloqueado' ? 'btn-outline-success' : 'btn-outline-danger'}" data-blq="${c.id}">${c.status === 'bloqueado' ? 'Desbloquear' : 'Bloquear'}</button>
      </td></tr>`; }).join('');
  }

  // renova a licença somando meses a partir de hoje ou da validade atual (o que for maior)
  async function registrarPagamento(c, { plano, meses, valor, forma }) {
    const base = Math.max(Date.now(), c.validoAteMs || 0);
    const validoAteMs = base + meses * 30 * DIA;
    await updateDoc(doc(db, 'clinicas', c.id), { plano, status: 'ativo', validoAteMs, valorMensal: PLANOS[plano].preco });
    await addDoc(collection(db, 'clinicas', c.id, 'faturas'), { plano, meses, valor, forma, data: toISODate(), validoAte: toISODate(new Date(validoAteMs)), registradoPor: auth.currentUser.email });
  }

  function formPagamento(c, sol) {
    const pl = sol?.plano || (PLANOS[c.plano]?.preco ? c.plano : 'pro');
    const ms = sol?.meses || 1;
    formModal({
      title: `Pagamento · ${esc(c.nome)}`, size: 'md', submit: 'Confirmar e liberar',
      values: { plano: pl, meses: ms, valor: sol?.valor ?? PLANOS[pl].preco * ms, forma: 'PIX' },
      fields: [
        { name: 'plano', label: 'Plano', type: 'select', required: true, options: ['basico', 'pro', 'premium'].map(k => ({ value: k, label: `${PLANOS[k].nome} (${money(PLANOS[k].preco)})` })), col: 'col-md-6' },
        { name: 'meses', label: 'Meses', type: 'select', required: true, options: [1, 3, 6, 12].map(n => ({ value: n, label: `${n} mês(es)` })), col: 'col-md-6' },
        { name: 'valor', label: 'Valor recebido', type: 'money', required: true, col: 'col-md-6' },
        { name: 'forma', label: 'Forma', type: 'select', options: ['PIX', 'Cartão', 'Boleto', 'Transferência', 'Cortesia'], col: 'col-md-6' }
      ],
      onShown: (el) => { const f = el.querySelector('form'); const calc = () => f.valor.value = (PLANOS[f.plano.value].preco * Number(f.meses.value)).toFixed(2); f.plano.onchange = calc; f.meses.onchange = calc; },
      onSubmit: async (d) => {
        await registrarPagamento(c, { ...d, meses: Number(d.meses) });
        if (sol) await updateDoc(doc(db, 'solicitacoes', sol.id), { status: 'aprovado', aprovadoEm: new Date().toISOString() });
        toast('Licença liberada ✔'); await carregar();
      }
    });
  }

  function formRede(c) {
    const outrasRedes = [...new Set(clinicas.filter(x => x.redeId && x.id !== c.id).map(x => x.redeId))];
    formModal({
      title: `Rede · ${esc(c.nome)}`, size: 'sm', submit: 'Salvar', values: { redeId: c.redeId || '' },
      fields: [
        { name: 'redeId', label: 'Identificador da rede', col: 'col-12', placeholder: 'ex.: grupo-amigo-fiel', attrs: 'list="redesExistentes"' },
        { type: 'custom', col: 'col-12', html: `<datalist id="redesExistentes">${outrasRedes.map(r => `<option value="${esc(r)}">`).join('')}</datalist>
          <div class="fs-8 text-muted">Use o <strong>mesmo texto</strong> em todas as unidades do mesmo dono para agrupá-las. Deixe em branco para tirar esta clínica de qualquer rede.</div>` }
      ],
      onSubmit: async (d) => {
        await updateDoc(doc(db, 'clinicas', c.id), { redeId: d.redeId.trim() || null });
        toast(d.redeId.trim() ? 'Clínica agrupada na rede' : 'Clínica removida da rede');
        await carregar();
      }
    });
  }

  async function acoes(e) {
    const b = e.target.closest('button'); if (!b) return;
    const c = clinicas.find(x => x.id === (b.dataset.pag || b.dataset.trial || b.dataset.blq || b.dataset.cob || b.dataset.rede));
    if (b.dataset.cob) cobrar(c);
    if (b.dataset.pag) formPagamento(c);
    if (b.dataset.rede) formRede(c);
    if (b.dataset.trial) { await updateDoc(doc(db, 'clinicas', c.id), { validoAteMs: Math.max(Date.now(), c.validoAteMs || 0) + 7 * DIA }); toast('Teste estendido em 7 dias'); carregar(); }
    if (b.dataset.blq && await confirmar(`${c.status === 'bloqueado' ? 'Desbloquear' : 'Bloquear'} <strong>${esc(c.nome)}</strong>?`, { danger: c.status !== 'bloqueado' })) {
      await updateDoc(doc(db, 'clinicas', c.id), { status: c.status === 'bloqueado' ? (c.plano === 'trial' ? 'trial' : 'ativo') : 'bloqueado' }); carregar();
    }
    if (b.dataset.apr) { const s = solicitacoes.find(x => x.id === b.dataset.apr); formPagamento(clinicas.find(x => x.id === s.clinicaId), s); }
    if (b.dataset.rej && await confirmar('Recusar este aviso de pagamento?')) { await updateDoc(doc(db, 'solicitacoes', b.dataset.rej), { status: 'recusado' }); carregar(); }
  }

  // gera QR Code PIX + link de pagamento para enviar a uma clínica
  function cobrar(c) {
    const planoIni = PLANOS[c.plano]?.preco ? c.plano : 'pro';
    const fone = (c.telefone || '').replace(/\D/g, '');
    const { el } = modal({
      title: `Cobrar · ${esc(c.nome)}`, size: 'md',
      body: `
        <div class="row g-2 mb-3">
          <div class="col-5"><label class="form-label">Plano</label><select class="form-select" id="cbPlano">${['basico', 'pro', 'premium'].map(k => `<option value="${k}" ${k === planoIni ? 'selected' : ''}>${PLANOS[k].nome}</option>`).join('')}</select></div>
          <div class="col-3"><label class="form-label">Meses</label><select class="form-select" id="cbMeses">${[1, 3, 6, 12].map(m => `<option>${m}</option>`).join('')}</select></div>
          <div class="col-4"><label class="form-label">Valor (R$)</label><input type="number" step="0.01" min="0" class="form-control" id="cbValor"></div>
        </div>
        ${cfg.pixChave ? '<div id="cbPix" class="mb-3"></div>' : '<div class="alert alert-warning fs-7">Cadastre sua chave PIX em <strong>Formas de pagamento</strong> para gerar o QR Code.</div>'}
        <label class="form-label fs-7 mb-1">Link de pagamento <span class="text-muted fw-normal">(página com QR Code, copia e cola e cartão)</span></label>
        <div class="input-group"><input class="form-control" style="font-size:.75rem" readonly id="cbLink">
          <button class="btn btn-outline-primary" type="button" id="cbCopiar"><i class="bi bi-clipboard"></i></button></div>`,
      footer: `<a class="btn btn-light border me-auto" target="_blank" id="cbAbrir"><i class="bi bi-box-arrow-up-right me-1"></i>Abrir página</a>
        ${fone ? '<a class="btn btn-success" target="_blank" id="cbWhats"><i class="bi bi-whatsapp me-1"></i>Enviar no WhatsApp</a>' : ''}`
    });
    const plano = $('#cbPlano', el), meses = $('#cbMeses', el), valor = $('#cbValor', el);

    function atualizar(recalcular) {
      if (recalcular) valor.value = (PLANOS[plano.value].preco * Number(meses.value)).toFixed(2);
      const v = Number(valor.value) || 0;
      const link = linkPagamento({ plano: plano.value, meses: meses.value, clinicaId: c.id, nome: c.nome, valor: v });
      $('#cbLink', el).value = link;
      $('#cbAbrir', el).href = link;
      const w = $('#cbWhats', el);
      if (w) w.href = `https://wa.me/55${fone}?text=${encodeURIComponent(`Olá! Segue o link para pagamento da assinatura Petzy da ${c.nome}.\nPlano ${PLANOS[plano.value].nome} · ${meses.value} mês(es) · ${money(v)}\n\n${link}`)}`;
      if (cfg.pixChave) renderPix($('#cbPix', el), {
        chave: cfg.pixChave, nome: cfg.pixNome, cidade: cfg.pixCidade, valor: v,
        txid: txid(c.id, plano.value, meses.value), descricao: `Petzy ${PLANOS[plano.value].nome} ${meses.value}m`
      });
    }

    plano.onchange = meses.onchange = () => atualizar(true);
    valor.onchange = () => atualizar(false);
    $('#cbCopiar', el).onclick = async () => { await copiar($('#cbLink', el).value); toast('Link copiado'); };
    atualizar(true);
  }

  function configurar() {
    formModal({
      title: 'Formas de pagamento da licença', values: { pixChave: cfg.pixChave, pixNome: cfg.pixNome, pixCidade: cfg.pixCidade, whatsapp: cfg.whatsapp, linkBasico: cfg.links?.basico, linkPro: cfg.links?.pro, linkPremium: cfg.links?.premium },
      fields: [
        { type: 'section', label: 'PIX (gera QR Code e copia e cola automaticamente)' },
        { name: 'pixChave', label: 'Chave PIX', col: 'col-12', placeholder: 'CPF, CNPJ, e-mail, +5511999999999 ou chave aleatória' },
        { name: 'pixNome', label: 'Nome do favorecido (como no banco)', col: 'col-md-8', attrs: 'maxlength="25"' },
        { name: 'pixCidade', label: 'Cidade', col: 'col-md-4', attrs: 'maxlength="15"', placeholder: 'SAO PAULO' },
        { name: 'whatsapp', label: 'WhatsApp do suporte (com DDI)', col: 'col-12', placeholder: '5511999999999' },
        { type: 'section', label: 'Links de pagamento recorrente (Mercado Pago, Asaas, Stripe...)' },
        { name: 'linkBasico', label: 'Link plano Básico', col: 'col-12' }, { name: 'linkPro', label: 'Link plano Profissional', col: 'col-12' }, { name: 'linkPremium', label: 'Link plano Premium', col: 'col-12' }
      ],
      onSubmit: async (d) => {
        await setDoc(doc(db, 'sistema', 'config'), { pixChave: d.pixChave, pixNome: d.pixNome, pixCidade: d.pixCidade, whatsapp: d.whatsapp, links: { basico: d.linkBasico, pro: d.linkPro, premium: d.linkPremium } });
        toast('Configuração salva'); await carregar();
      }
    });
  }

  // Dados usados nas páginas públicas de Termos de Uso e Política de Privacidade (termos.html/
  // privacidade.html) — ficam em /sistema/legal, leitura pública (qualquer visitante vê essas duas
  // páginas sem estar logado), escrita só pelo superadmin.
  async function configurarLegal() {
    const legal = (await getDoc(doc(db, 'sistema', 'legal')).catch(() => null))?.data() || {};
    formModal({
      title: 'Dados legais (Termos de Uso e Privacidade)', size: 'lg', submit: 'Salvar',
      values: legal,
      fields: [
        { type: 'custom', col: 'col-12', html: '<div class="alert alert-info fs-7">Esses dados aparecem automaticamente nas páginas públicas <code>termos.html</code> e <code>privacidade.html</code>. Recomendamos revisão de um(a) advogado(a) antes de tratar como definitivo.</div>' },
        { name: 'razaoSocial', label: 'Razão social ou nome completo (responsável legal)', required: true, col: 'col-12' },
        { name: 'cnpjCpf', label: 'CNPJ ou CPF', required: true, col: 'col-md-6' },
        { name: 'ie', label: 'Inscrição estadual/municipal (opcional)', col: 'col-md-6' },
        { name: 'endereco', label: 'Endereço completo', col: 'col-12' },
        { name: 'foroCidade', label: 'Cidade do foro', required: true, col: 'col-md-8' },
        { name: 'foroUf', label: 'UF', required: true, col: 'col-md-4', attrs: 'maxlength="2" style="text-transform:uppercase"' },
        { name: 'emailContato', label: 'E-mail de contato / privacidade', type: 'email', required: true, col: 'col-12' },
        { name: 'prazoRetencaoDias', label: 'Dias de retenção de dados após cancelamento', type: 'number', col: 'col-md-6', default: 90 },
        { name: 'reajusteAvisoDias', label: 'Dias de aviso prévio para reajuste de preço', type: 'number', col: 'col-md-6', default: 30 }
      ],
      onSubmit: async (d) => {
        d.foroUf = (d.foroUf || '').toUpperCase();
        await setDoc(doc(db, 'sistema', 'legal'), { ...d, atualizadoEm: new Date().toISOString() });
        toast('Dados legais salvos — já refletem em termos.html e privacidade.html');
      }
    });
  }

  // /superadmins tem escrita bloqueada nas regras do Firestore de propósito — só esta função (via
  // Cloud Functions com Admin SDK) pode conceder ou revogar o acesso, e só quem já é superadmin
  // consegue chamá-la. A pessoa precisa já ter uma conta no Petzy (login.html) antes de virar admin.
  async function gerenciarSuperadmins() {
    const meuUid = auth.currentUser?.uid;
    let lista = [];
    const { el } = modal({
      title: '<i class="bi bi-shield-lock me-2 text-primary"></i>Administradores do Petzy', size: 'md',
      body: `
        <p class="text-muted fs-7">Quem estiver aqui tem acesso total a este painel — todas as clínicas, licenças e cobranças. A pessoa precisa já ter uma conta cadastrada no Petzy.</p>
        <div class="d-flex gap-2 mb-3">
          <input class="form-control" id="emailNovoAdmin" type="email" placeholder="e-mail da pessoa">
          <button class="btn btn-primary text-nowrap" id="btnConceder"><i class="bi bi-plus-lg me-1"></i>Conceder</button>
        </div>
        <div id="listaSuperadmins"><div class="loading"><div class="spinner-border spinner-border-sm"></div></div></div>`
    });

    async function carregar() {
      lista = (await chamarFuncao('listarSuperadmins', {})).lista;
      $('#listaSuperadmins', el).innerHTML = lista.length ? `<div class="list-group list-group-flush">${lista.map(s => `
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <div><div class="fw-semibold fs-7">${esc(s.nome || s.email)}${s.uid === meuUid ? ' <span class="badge bg-primary">você</span>' : ''}</div>
          <div class="fs-8 text-muted">${esc(s.email)}</div></div>
          <button class="btn btn-sm btn-outline-danger" data-revogar="${esc(s.email)}" ${lista.length <= 1 ? 'disabled title="não é possível remover o único administrador"' : ''}><i class="bi bi-x-lg"></i></button>
        </div>`).join('')}</div>` : '<p class="text-muted fs-7">Nenhum administrador encontrado.</p>';
    }

    $('#btnConceder', el).onclick = async () => {
      const btn = $('#btnConceder', el), email = $('#emailNovoAdmin', el).value.trim();
      if (!email) return toast('Informe o e-mail da pessoa.', 'warning');
      btn.disabled = true;
      try {
        const r = await chamarFuncao('gerenciarSuperadmin', { email, acao: 'conceder' });
        toast(`${r.nome} agora é administrador(a) do Petzy`);
        $('#emailNovoAdmin', el).value = '';
        await carregar();
      } catch (e) { toast(e.message, 'danger'); }
      finally { btn.disabled = false; }
    };
    $('#listaSuperadmins', el).onclick = async (e) => {
      const b = e.target.closest('[data-revogar]'); if (!b) return;
      if (!(await confirmar(`Remover o acesso de administrador de <strong>${esc(b.dataset.revogar)}</strong>?`))) return;
      try {
        await chamarFuncao('gerenciarSuperadmin', { email: b.dataset.revogar, acao: 'revogar' });
        toast('Acesso removido');
        await carregar();
      } catch (e) { toast(e.message, 'danger'); }
    };

    await carregar();
  }
</script>
</body>
</html>
