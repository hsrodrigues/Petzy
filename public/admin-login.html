<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso restrito · Petzy Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark">

<div class="vh-100 d-grid" style="place-items:center">
  <div class="card shadow-lg border-0 rounded-4" style="width:100%;max-width:400px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <span class="brand-logo mx-auto mb-2" style="width:52px;height:52px;font-size:1.5rem">🛡️</span>
        <h1 class="h5 fw-bold mb-1">Painel SaaS · Petzy</h1>
        <p class="text-muted fs-7 mb-0">Acesso exclusivo do dono da plataforma — não cria nem entra em nenhuma clínica.</p>
      </div>

      <button class="btn btn-light border w-100 d-flex align-items-center justify-content-center gap-2 mb-3" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuar com Google
      </button>
      <div class="d-flex align-items-center gap-3 my-3 text-muted fs-7"><hr class="flex-fill"> ou com e-mail <hr class="flex-fill"></div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input class="form-control" type="email" name="email" required autocomplete="email">
        </div>
        <div class="mb-4">
          <label class="form-label">Senha</label>
          <input class="form-control" type="password" name="senha" required minlength="6" autocomplete="current-password">
        </div>
        <button class="btn btn-dark w-100" type="submit" id="btnSubmit">
          <span class="spinner-border spinner-border-sm me-2 d-none"></span>Entrar
        </button>
      </form>
      <p class="text-center fs-8 text-muted mt-4 mb-0">Não é o dono da plataforma? <a href="login.html">Acesse pelo login normal</a>.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { auth, db, googleProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut, doc, getDoc } from './js/firebase.js';
  import { $, toast } from './js/ui.js';

  // Esta tela só autentica — nunca cria clínica nem doc em /usuarios. Quem entra aqui e não é
  // superadmin é deslogado na hora: essa tela não deve virar uma porta pro login normal da equipe.
  const ERROS = {
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'Nenhuma conta com este e-mail.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.'
  };
  const erro = (e) => toast(ERROS[e.code] || e.message, 'danger');
  let verificando = false;

  onAuthStateChanged(auth, async (user) => {
    if (!user || verificando) return;
    verificando = true;
    const sa = await getDoc(doc(db, 'superadmins', user.uid)).catch(() => null);
    if (sa?.exists()) { location.replace('admin.html'); return; }
    // desloga PRIMEIRO — se o toast falhar por algum motivo, a conta sem acesso não pode ficar presa logada
    await signOut(auth);
    verificando = false;
    toast('Esta conta não tem acesso ao painel administrativo.', 'danger');
  });

  $('#btnGoogle').onclick = async () => {
    try { await signInWithPopup(auth, googleProvider); }
    catch (e) { erro(e); }
  };

  $('#formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    if (!f.checkValidity()) { f.classList.add('was-validated'); return; }
    const btn = $('#btnSubmit'), spin = btn.querySelector('.spinner-border');
    btn.disabled = true; spin.classList.remove('d-none');
    try { await signInWithEmailAndPassword(auth, f.email.value.trim(), f.senha.value); }
    catch (err) { erro(err); btn.disabled = false; spin.classList.add('d-none'); }
  };
</script>
</body>
</html>
