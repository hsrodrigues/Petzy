<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal do tutor · Petzy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="boot" class="vh-100 d-grid" style="place-items:center">
  <div class="text-center"><div class="brand-logo mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem">🐾</div><div class="spinner-border"></div></div>
</div>

<!-- ---------- login ---------- -->
<main id="telaLogin" class="hero d-none" style="min-height:100vh">
  <div class="container py-5" style="max-width:440px">
    <div class="text-center mb-4" id="marcaLogin">
      <span class="brand-logo mx-auto mb-2" style="width:52px;height:52px;font-size:1.5rem">🐾</span>
      <h1 class="h4 fw-bold mb-0" id="nomeClinicaLogin">Petzy</h1>
      <p class="text-muted fs-7">Portal do tutor</p>
    </div>
    <div class="card shadow-lg border-0 rounded-4"><div class="card-body p-4">
      <h2 class="h5 fw-bold mb-1">Acompanhe seu pet</h2>
      <p class="text-muted fs-7 mb-4">Digite o telefone e o CPF que você cadastrou na clínica.</p>
      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label class="form-label">Telefone / WhatsApp</label>
          <input class="form-control form-control-lg" name="telefone" inputmode="numeric" placeholder="(00) 00000-0000" required autocomplete="tel">
        </div>
        <div class="mb-4">
          <label class="form-label">CPF</label>
          <input class="form-control form-control-lg" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required autocomplete="off">
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit" id="btnEntrar">
          <span class="spinner-border spinner-border-sm me-2 d-none"></span><span>Entrar</span>
        </button>
      </form>
      <p class="text-center text-muted fs-8 mt-4 mb-0">Problemas para entrar? Fale com a recepção da clínica.</p>
    </div></div>
  </div>
</main>

<!-- ---------- área logada ---------- -->
<div id="telaApp" class="d-none">
  <header class="app-topbar" style="position:sticky">
    <div class="d-flex align-items-center gap-2">
      <span class="brand-logo" id="logoTopo">🐾</span>
      <div class="lh-sm"><div class="fw-bold" id="nomeClinicaTopo">Petzy</div><div class="fs-8 text-muted">Portal do tutor</div></div>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="text-muted fs-7 d-none d-sm-inline" id="nomeTutorTopo"></span>
      <button class="btn btn-light border btn-sm" id="btnSair"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
    </div>
  </header>
  <main class="app-content" style="max-width:920px;margin:0 auto" id="conteudo"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { auth, onAuthStateChanged, signInWithCustomToken, signOut, chamarFuncao, mensagemErroFuncao } from './js/firebase.js';
  import { $, $$, esc, toast, modal, mask, fmtDate, idade, badge, empty } from './js/ui.js';

  // Não importar de ./js/pets.js aqui: ele carrega ./js/app.js, que dispara o login da EQUIPE
  // (espera um doc em /usuarios) e brigaria com a sessão do tutor. Duplicamos só o essencial.
  const EMOJI_PET = { 'Cão': '🐶', 'Gato': '🐱', 'Ave': '🦜', 'Roedor': '🐹', 'Réptil': '🦎', 'Coelho': '🐰' };
  const emoji = (e) => EMOJI_PET[e] || '🐾';
  const fotoPet = (p, cls = '') => p.foto
    ? `<img src="${p.foto}" class="${cls}" alt="${esc(p.nome)}" style="object-fit:cover">`
    : `<div class="${cls} d-grid" style="place-items:center;background:linear-gradient(135deg,#efedff,#e3f8f2)">${emoji(p.especie)}</div>`;

  const params = new URLSearchParams(location.search);
  const clinicaId = params.get('c') || '';
  let dados = null;

  function erroFatal(msg) {
    $('#boot').innerHTML = `<div class="text-center p-4" style="max-width:420px"><i class="bi bi-exclamation-octagon text-danger fs-1"></i>
      <h5 class="mt-3">${esc(msg)}</h5><p class="text-muted fs-7">Peça à clínica o link correto do portal.</p></div>`;
  }

  if (!clinicaId) { erroFatal('Link de acesso inválido.'); }
  else {
    // mostra o nome da clínica antes mesmo do login. Isso não pode ler /clinicas/{cid} direto (as
    // regras exigem ser membro da clínica), então passa por uma function sem autenticação que só
    // devolve nome/logo — nunca dados sensíveis como status da licença ou responsável pela conta.
    chamarFuncao('portalInfo', { clinicaId }).then(c => {
      $('#nomeClinicaLogin').textContent = c.nome || 'Petzy';
      if (c.logo) $('#marcaLogin .brand-logo').outerHTML = `<img src="${c.logo}" style="width:64px;height:64px;object-fit:contain;border-radius:14px" class="mx-auto mb-2 d-block">`;
      $('#boot').classList.add('d-none');
      $('#telaLogin').classList.remove('d-none');
    }).catch((e) => erroFatal(e.code === 'functions/not-found' ? 'Clínica não encontrada.' : 'Não foi possível carregar a clínica.'));
  }

  mask($('#formLogin [name=telefone]'), 'tel');
  mask($('#formLogin [name=cpf]'), 'cpf');

  onAuthStateChanged(auth, async (user) => {
    if (!user || !clinicaId) return;
    try {
      const claims = (await user.getIdTokenResult()).claims;
      if (!claims.portal || claims.cid !== clinicaId) { await signOut(auth); return; } // token de outra clínica/sessão de equipe
      await carregarDados();
      $('#boot').classList.add('d-none');
      $('#telaLogin').classList.add('d-none');
      $('#telaApp').classList.remove('d-none');
    } catch (e) {
      erroFatal(mensagemErroFuncao(e));
    }
  });

  $('#formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = $('#btnEntrar');
    btn.disabled = true; $('.spinner-border', btn).classList.remove('d-none');
    try {
      const { token } = await chamarFuncao('portalLogin', { clinicaId, telefone: f.telefone.value, cpf: f.cpf.value });
      await signInWithCustomToken(auth, token);
    } catch (err) {
      toast(mensagemErroFuncao(err), 'danger');
      btn.disabled = false; $('.spinner-border', btn).classList.add('d-none');
    }
  };

  $('#btnSair').onclick = () => signOut(auth).then(() => location.reload());

  async function carregarDados() {
    dados = await chamarFuncao('portalDados', {});
    $('#nomeClinicaTopo').textContent = dados.clinica.nome;
    $('#nomeTutorTopo').textContent = dados.cliente.nome;
    if (dados.clinica.logo) $('#logoTopo').outerHTML = `<img id="logoTopo" src="${dados.clinica.logo}" style="width:36px;height:36px;object-fit:contain;border-radius:9px">`;
    desenhar();
  }

  const porPet = (arr, petId) => arr.filter(x => x.petId === petId).sort((a, b) => String(b.data || b.proximaDose || b.inicio || '').localeCompare(String(a.data || a.proximaDose || a.inicio || '')));

  function desenhar() {
    const { pets, vacinas, atendimentos, agendamentos } = dados;
    $('#conteudo').innerHTML = `
      <div class="page-header"><div><h1>Olá, ${esc(dados.cliente.nome.split(' ')[0])}! 👋</h1><p>Acompanhe a saúde do seu pet e peça um horário quando precisar.</p></div></div>
      ${pets.length ? '' : empty('heart', 'Nenhum pet encontrado no seu cadastro. Fale com a recepção.')}
      <div class="row g-3">
        ${pets.map(p => {
          const vac = porPet(vacinas, p.id), atd = porPet(atendimentos, p.id), ag = porPet(agendamentos, p.id);
          const hoje = new Date().toISOString().slice(0, 10);
          const proxVac = vac.filter(v => v.proximaDose).sort((a, b) => a.proximaDose.localeCompare(b.proximaDose))[0];
          return `<div class="col-12"><div class="card">
            <div class="card-body d-flex flex-wrap gap-3 align-items-center">
              <div style="width:64px;height:64px;border-radius:16px;overflow:hidden;font-size:1.8rem">${fotoPet(p, 'w-100 h-100')}</div>
              <div class="flex-fill">
                <h5 class="fw-bold mb-0">${esc(p.nome)}</h5>
                <div class="text-muted fs-7">${esc([p.especie, p.raca].filter(Boolean).join(' · '))} · ${idade(p.nascimento)}${p.peso ? ' · ' + p.peso + ' kg' : ''}</div>
              </div>
              ${proxVac ? badge(`Vacina ${proxVac.proximaDose < hoje ? 'atrasada' : 'em ' + fmtDate(proxVac.proximaDose)}`, proxVac.proximaDose < hoje ? 'danger' : 'info') : ''}
              ${ag.length ? badge(`Próxima consulta: ${fmtDate(ag[ag.length - 1].inicio?.slice(0, 10))}`, 'primary') : ''}
              <button class="btn btn-soft btn-sm" data-solicitar="${p.id}"><i class="bi bi-calendar-plus me-1"></i>Solicitar horário</button>
            </div>
            <ul class="nav nav-pills px-3 gap-1" id="tabs-${p.id}">
              <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#vac-${p.id}">Vacinas (${vac.length})</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#atd-${p.id}">Histórico (${atd.length})</button></li>
            </ul>
            <div class="tab-content px-3 pb-3">
              <div class="tab-pane fade show active" id="vac-${p.id}">${vac.length ? `<div class="table-responsive"><table class="table table-sm mb-0">
                <thead><tr><th>Vacina</th><th>Aplicação</th><th>Próxima dose</th></tr></thead><tbody>
                ${vac.map(v => `<tr><td class="fs-7">${esc(v.nome)}</td><td class="fs-7">${fmtDate(v.dataAplicacao)}</td><td>${v.proximaDose ? badge(fmtDate(v.proximaDose), v.proximaDose < hoje ? 'danger' : 'success') : '—'}</td></tr>`).join('')}
                </tbody></table></div>` : '<p class="text-muted fs-7 mb-0">Nenhuma vacina registrada.</p>'}</div>
              <div class="tab-pane fade" id="atd-${p.id}">${atd.length ? atd.map(a => `
                <div class="border-bottom py-2"><div class="d-flex justify-content-between"><strong class="fs-7">${esc(a.tipo || 'Consulta')}</strong><span class="text-muted fs-8">${fmtDate(a.data?.slice(0, 10))}</span></div>
                ${a.diagnostico ? `<div class="fs-7">${esc(a.diagnostico)}</div>` : ''}
                ${a.orientacoes || a.receitaObs ? `<div class="fs-8 text-muted">${esc(a.orientacoes || a.receitaObs)}</div>` : ''}</div>`).join('') : '<p class="text-muted fs-7 mb-0">Nenhum atendimento registrado ainda.</p>'}</div>
            </div>
          </div></div>`;
        }).join('')}
      </div>`;

    $$('[data-solicitar]').forEach(b => b.onclick = () => solicitar(b.dataset.solicitar));
  }

  const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function solicitar(petId) {
    const p = dados.pets.find(x => x.id === petId);
    let grade = [], diaAtivo = 0, horarioEscolhido = '';
    const { el, close } = modal({
      title: `Solicitar horário para ${esc(p.nome)}`, size: 'md',
      body: `
        <label class="form-label">O que o(a) ${esc(p.nome)} precisa?</label>
        <input class="form-control mb-3" id="motivoSolic" placeholder="Ex.: consulta de rotina, vacina, está sem apetite..." maxlength="200">
        <label class="form-label">Escolha um horário</label>
        <ul class="nav nav-pills gap-1 mb-2 flex-nowrap overflow-auto pb-1" id="diasGrade" style="scrollbar-width:thin"></ul>
        <div class="d-flex flex-wrap gap-2 mb-2" id="slotsGrade"></div>
        <div class="fs-8 text-muted mb-3 d-none" id="semHorario"></div>
        <label class="form-label">Prefere outro dia/horário? <span class="text-muted fw-normal">(opcional, se nenhum acima serve)</span></label>
        <input class="form-control" id="prefSolic" placeholder="Ex.: terça ou quinta à tarde" maxlength="150">
        <div class="alert alert-info fs-8 mt-3 mb-0"><i class="bi bi-info-circle me-1"></i>A clínica vai entrar em contato para confirmar o horário.</div>`,
      footer: '<button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="okSolic"><i class="bi bi-send me-1"></i>Enviar pedido</button>'
    });

    function desenharGrade() {
      const diasEl = $('#diasGrade', el), slotsEl = $('#slotsGrade', el), semEl = $('#semHorario', el);
      if (!grade.length) {
        diasEl.innerHTML = ''; slotsEl.innerHTML = '';
        semEl.textContent = 'Nenhum horário livre nos próximos dias. Descreva sua preferência abaixo que a equipe encontra um horário.';
        semEl.classList.remove('d-none');
        return;
      }
      diasEl.innerHTML = grade.map((d, i) => {
        const dt = new Date(d.data + 'T00:00');
        return `<li class="nav-item"><button type="button" class="nav-link ${i === diaAtivo ? 'active' : ''}" data-dia="${i}">${DIAS_SEMANA[dt.getDay()]} ${dt.getDate()}</button></li>`;
      }).join('');
      const dia = grade[diaAtivo];
      semEl.classList.toggle('d-none', Boolean(dia.slots.length));
      slotsEl.innerHTML = dia.slots.map(h => `<button type="button" class="btn btn-sm btn-light border" data-hora="${h}">${h}</button>`).join('');
      diasEl.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => { diaAtivo = Number(b.dataset.dia); desenharGrade(); });
      slotsEl.querySelectorAll('[data-hora]').forEach(b => b.onclick = () => {
        horarioEscolhido = `${dia.data}T${b.dataset.hora}`;
        slotsEl.querySelectorAll('[data-hora]').forEach(x => x.className = 'btn btn-sm btn-light border');
        b.className = 'btn btn-sm btn-primary';
      });
    }
    chamarFuncao('agendamentoPublicoHorarios', { clinicaId }).then(r => { grade = r.dias || []; desenharGrade(); }).catch(() => desenharGrade());

    $('#okSolic', el).onclick = async () => {
      const motivo = $('#motivoSolic', el).value.trim();
      if (motivo.length < 3) return toast('Descreva rapidamente o motivo.', 'warning');
      const btn = $('#okSolic', el); btn.disabled = true;
      try {
        await chamarFuncao('portalSolicitarAgendamento', { petId, motivo, horario: horarioEscolhido, preferencia: $('#prefSolic', el).value.trim() });
        toast('Pedido enviado! A clínica vai te chamar para confirmar. 🐾');
        close();
      } catch (err) { toast(mensagemErroFuncao(err), 'danger'); btn.disabled = false; }
    };
  }
</script>
</body>
</html>
